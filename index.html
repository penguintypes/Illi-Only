    <script>
        // Simple animation library to replace Framer Motion
        class SimpleAnimation {
            static animate(element, keyframes, options = {}) {
                const {
                    duration = 0.8,
                    delay = 0,
                    ease = 'easeInOut',
                    onComplete = null
                } = options;

                setTimeout(() => {
                    element.style.animation = `${keyframes} ${duration}s ${ease}`;
                    if (onComplete) {
                        setTimeout(onComplete, duration * 1000);
                    }
                }, delay * 1000);
            }

            static fadeIn(element, delay = 0) {
                this.animate(element, 'fadeIn', { delay });
            }

            static slideUp(element, delay = 0) {
                this.animate(element, 'slideUp', { delay });
            }
        }

        // Application State

                        </span>

        // Render Lyrics Screen
        function renderLyricsScreen() {
            const lyricsHtml = lyrics.map((line, index) => {
                const isActive = currentLyricLine === index;

                const opacity = isActive ? 1 : (isPast ? 0.2 : 0);
                const scale = isActive ? 1.1 : 0.9;
                const blur = isActive ? 0 : 4;
                const zIndex = isActive ? 20 : 0;
                const visibility = isActive || isPast ? 'visible' : 'hidden';
                
                return `
                    <div class="absolute top-1/2 -translate-y-1/2 w-full text-4xl md:text-5xl font-black tracking-wide leading-tight will-change-transform" style="opacity: ${opacity}; transform: scale(${scale}) translateY(${isActive ? 0 : 40}px); filter: blur(${blur}px); z-index: ${zIndex}; visibility: ${visibility}; transition: all 0.3s ease;">
                        ${line}
                    </div>
                `;
            }).join('');

            const barsHtml = [1, 2, 3, 4, 5].map((i) => {

                    <div class="absolute top-[-12%] left-[-8%] w-120 h-120 rounded-full bg-rose-500/14 blur-[150px] opacity-80" />
                    <div class="absolute bottom-[-18%] right-[-10%] w-135 h-135 rounded-full bg-fuchsia-500/10 blur-[160px] opacity-70" />
                    <div class="absolute inset-0 bg-[radial-gradient(circle_at_center,rgba(140,60,95,0.10)_0%,transparent_68%)]" />
                    <div class="absolute inset-0 bg-linear-to-b from-black/20 via-transparent to-black/40" />
                    <div class="absolute inset-0 bg-[linear-gradient(to_top,rgba(20,6,14,0.55),transparent_45%)]" />
                </div>
            `;
        }

        // Render current screen
        function render() {
            let screenContent = '';
            
            if (currentScreen === 0) {
                screenContent = renderScreen1();
            } else if (currentScreen === 1) {
                screenContent = renderScreen2();
            } else if (currentScreen === 2) {
                screenContent = renderLyricsScreen();
            } else if (currentScreen === 3) {
                screenContent = renderFinalScreen();
            }

            const html = `
                <div class="min-h-screen text-pink-50 flex items-center justify-center overflow-hidden relative">
                    ${renderBackground()}
                    
                    <div class="relative z-10 w-full max-w-100 p-5">
                        ${screenContent}
                    </div>
                    
                    <div class="fixed bottom-4 right-4 text-sm text-white/40 pointer-events-none z-50 font-light" style="animation: slideUp 0.4s ease-out;">
                        @anujbuilds
                    </div>
                </div>
            `;

            document.getElementById('root').innerHTML = html;
        }

        // Event handlers
        function handleScreen1Next() {
            currentScreen = 1;
            render();
        }

        function handleScreen2Next() {
            audioElement.play().catch(err => console.log("Audio play failed:", err));
            currentScreen = 2;
            startLyricsAnimation();
            render();
        }

        function startLyricsAnimation() {
            currentLyricLine = -1;
            
            lyricTimings.forEach((time, index) => {
                setTimeout(() => {
                    currentLyricLine = index;
                    render();
                }, time);
            });
            
            setTimeout(() => {
                currentScreen = 3;
                render();
            }, 7500);
        }

        // Initial render
        render();
    </script>
</body>
</html>
